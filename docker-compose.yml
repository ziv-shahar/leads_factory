version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadgen_postgres
    environment:
      POSTGRES_DB: leadgen_db
      POSTGRES_USER: leadgen_user
      POSTGRES_PASSWORD: leadgen_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen_user -d leadgen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
